# Runs the test suite (tests/) on every push and pull request.
# Free on GitHub for public repositories. The tests need no network or API keys:
# they run in a temporary folder with their own settings (tests/conftest.py).
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # Pinned, not ubuntu-latest: that moves to Ubuntu 26 (from Oct 2026), where prebuilt
    # older Pythons (3.10) may not exist yet. Move it up on purpose, after a test run.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # the oldest supported version (pyproject.toml) and a current one
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # What a new user installs (README), so problems with current releases show up here
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest
