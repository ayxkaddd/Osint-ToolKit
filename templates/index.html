<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - OSINT Toolkit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/tailwind.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-black text-white font-mono min-h-screen flex items-center justify-center px-4 bg-[linear-gradient(rgba(0,0,0,.9),rgba(0,0,0,.9)),repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(71,85,105,.1) 40px),repeating-linear-gradient(90deg,transparent,transparent 39px,rgba(71,85,105,.1) 40px)]">
    <main class="w-full max-w-sm">
        <div class="flex items-center justify-center gap-3 mb-6">
            <i class="fas fa-shield-alt text-3xl text-purple-400"></i>
            <span class="text-2xl font-bold">OSINT Toolkit</span>
        </div>
        <form id="loginForm" class="card space-y-4">
            <h1 class="text-lg font-semibold">Sign in</h1>
            <div>
                <label for="email" class="block text-sm text-gray-400 mb-1">Email</label>
                <input type="email" id="email" name="email" required autocomplete="username" class="field">
            </div>
            <div>
                <label for="password" class="block text-sm text-gray-400 mb-1">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password" class="field">
            </div>
            <p id="errorMessage" class="hidden text-sm text-red-400"><i class="fas fa-exclamation-circle mr-1"></i><span id="errorText"></span></p>
            <button type="submit" id="loginButton" class="btn-primary w-full">Sign in</button>
        </form>
    </main>

    <script>
        const loginForm = document.getElementById('loginForm');
        const loginButton = document.getElementById('loginButton');

        function showError(message) {
            document.getElementById('errorText').textContent = message;
            document.getElementById('errorMessage').classList.remove('hidden');
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            document.getElementById('errorMessage').classList.add('hidden');
            loginButton.disabled = true;
            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value,
                    }),
                    credentials: 'include',
                });
                const data = await response.json().catch(() => ({}));
                if (response.ok && data.success) {
                    window.location.href = '/dashboard';
                    return;
                }
                showError(response.status === 429 ? 'Too many attempts - wait a minute and try again.' : 'Wrong email or password.');
            } catch (error) {
                showError('Could not reach the server.');
            } finally {
                loginButton.disabled = false;
            }
        });
    </script>
</body>
</html>
