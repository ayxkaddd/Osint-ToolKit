[project]
name = "osint-toolkit-cli"
version = "0.2.0"
description = "Command-line client for an OSINT Toolkit server: investigations, identifiers and background lookups"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.28", "typer>=0.12", "rich>=13", "platformdirs>=4", "questionary>=2.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
osint = "osint_cli.main:app"

[project.urls]
Homepage = "https://github.com/ayxkaddd/Osint-ToolKit"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/osint_cli"]
