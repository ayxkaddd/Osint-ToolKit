[pytest]
testpaths = tests
addopts = -q
# tests/conftest.py moves into a temporary folder while pytest starts, so a plain
# `pytest` collects from the repo root: keep it out of the CLI (cli/tests needs the
# CLI installed; CI runs `pytest cli/tests` on its own). The rest are pytest's defaults.
norecursedirs = cli .* *.egg _darcs build CVS dist node_modules venv {arch}
